# Builds the client app (site root) and the trainer panel (/panel/) and publishes them on GitHub Pages.
name: Publikacja strony

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            panel/package-lock.json

      # A project site lives at /<repo>; a <user>.github.io repo lives at the domain root.
      - name: Ustal adres strony
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then echo "EXPO_BASE_URL=" >> "$GITHUB_ENV"; else echo "EXPO_BASE_URL=/$REPO" >> "$GITHUB_ENV"; fi

      - name: Aplikacja klienta
        working-directory: app
        env:
          EXPO_NO_TELEMETRY: 1
        run: |
          npm ci
          npx expo export --platform web --output-dir ../site
          node scripts/finish-web.mjs ../site

      - name: Panel trenera
        working-directory: panel
        run: |
          npm ci
          npx vite build --outDir ../site/panel --emptyOutDir

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
